# ~/.config/vibeshed/config.yaml
# Vibeshed — macOS launcher configuration
# Copy this file to ~/.config/vibeshed/config.yaml and customize.

appearance:
  panelWidth: 760
  # panelHeight = searchBarHeight + (visible rows × rowHeight)
  # Default fits exactly 8 rows: 56 + 8 × 52 = 472
  panelHeight: 472
  cornerRadius: 12
  rowHeight: 52
  searchBarHeight: 56
  # How solid the picker's background is while no overlay is behind it, 0–1:
  # 0 is bare glass (also what leaving `fill` out means), 1 hides what's behind.
  fill: 0.72

  # Backdrop over the whole screen behind the open picker. On when present:
  # `overlay:` alone (or `overlay: true`) uses the defaults shown here. It steps
  # aside while a live preview (theme/switch) is changing the desktop.
  # overlay:
  #   blur: 24              # blur radius in points; 0 leaves the screen sharp
  #   saturation: 1.4       # of what shows through: 0 greyscale, 1 unchanged, 2 vivid
  #   color: theme          # theme (the palette theme's darkest background; black or
  #                         # white by Dark/Light Mode without one), accent, or "#rrggbb"
  #   opacity: 0.25         # how strongly `color` covers the screen, 0–1
  #   vignette: 0.3         # extra `color` toward the screen edges, 0–1
  #   grain: 0              # film grain, 0–1
  #   material: none        # a system material's tint over the blur: hud, fullScreen,
  #                         # popover, menu, sidebar, underWindow
  #   allScreens: false     # cover every display, not just the picker's
  #   clickThrough: false   # true: clicks reach the app underneath (still closing the
  #                         # picker); false: a click on the overlay just closes it
  #   showAnimation: fade   # fade, blur (focus pull), iris (opens out from the picker), none
  #   showDuration: 0.3     # seconds
  #   hideAnimation: fade
  #   hideDuration: 0.2
  #   enabled: true         # false turns it off but keeps the settings
  # Reduce Motion turns blur/iris into a fade; Reduce Transparency drops the blur.

# ---------------------------------------------------------------------------
# Picker
# ---------------------------------------------------------------------------
# Esc goes back one level — from a parameter step or a pushed list to the list
# you picked it from — and closes the picker at the first level. ⌘Esc closes it
# from any level. A list or step that opens on its own (a run's results, like
# GitHub searches, the browser chooser, a keybinding's parameter step) is the
# first level, so Esc closes it. Live previews (theme/switch, fonts) revert on
# every way out. Esc, ⌘Esc, a click outside and running an action all leave the
# picker to open on a fresh search next time.
# ---------------------------------------------------------------------------
picker:
  # Hidden with the toggle hotkey instead, the picker keeps its place for this
  # many seconds: reopen sooner and you're back where you were, later and it
  # opens on a fresh search. 0 always opens fresh.
  resetAfter: 10

# ---------------------------------------------------------------------------
# Keybindings & Remaps
# ---------------------------------------------------------------------------
# Each entry has `combo` + either `action` (triggers a vibeshed action) or
# `remap` (remaps to another key combo). Optional `app` scopes to a bundle ID.
#
# Modifiers: cmd, ctrl, option/alt, shift, capslock (hyper), space
# Keys: a-z, 0-9, f1-f20, arrows, return, tab, space, escape, delete,
#        minus/-,  equal/=, leftbracket/[, rightbracket/], semicolon/;,
#        quote/', comma/,, period/., slash//, backslash/\, backtick/`
# Mouse: mouse1-mouse5, with optional modifier (ctrl+mouse4)
# Action format: module/action (e.g. "window/cycleLeft", "alias/Safari")
# ---------------------------------------------------------------------------
keybindings:
  # --- picker ---
  - combo: "capslock+space"
    action: "app/togglePicker"

  # --- app focus (hyper + number row) ---
  - combo: "capslock+1"
    action: "alias/Safari"
  - combo: "capslock+2"
    action: "alias/Chrome"
  - combo: "capslock+3"
    action: "alias/Zen"
  - combo: "capslock+4"
    action: "alias/IntelliJ"
  - combo: "capslock+5"
    action: "alias/VSCode"
  - combo: "capslock+6"
    action: "alias/Spotify"
  - combo: "capslock+7"
    action: "alias/Notes"
  - combo: "capslock+8"
    action: "alias/Zoom"
  - combo: "capslock+9"
    action: "alias/Telegram"
  - combo: "capslock+0"
    action: "alias/iTerm"

  # --- window management (hyper + letters) ---
  - combo: "capslock+a"
    action: "window/cycleLeft"
  - combo: "capslock+h"
    action: "window/cycleLeft"
  - combo: "capslock+d"
    action: "window/cycleRight"
  - combo: "capslock+l"
    action: "window/cycleRight"
  - combo: "capslock+w"
    action: "window/cycleTop"
  - combo: "capslock+s"
    action: "window/cycleBottom"
  - combo: "capslock+m"
    action: "window/toggleMaximize"
  - combo: "capslock+r"
    action: "window/center"
  - combo: "capslock+p"
    action: "window/focusWindow"       # show focus window picker
  - combo: "capslock+g"
    action: "system/missionControl"    # show all windows and desktops
  - combo: "capslock+backslash"
    action: "window/tileRight"         # tile window to right half
  - combo: "capslock+n"
    action: "tiling/swapNextSplit"     # swap focused window with next split
  - combo: "capslock+minus"
    action: "window/shrinkWidth"       # make window narrower
  - combo: "capslock+equal"
    action: "window/enlargeWidth"      # make window wider

  # --- window focus ---
  - combo: "capslock+leftbracket"
    action: "window/focusWindow"
  - combo: "capslock+comma"
    action: "window/focusWindow"
  - combo: "capslock+rightbracket"
    action: "window/focusWindow"
  - combo: "capslock+period"
    action: "window/focusWindow"
  - combo: "capslock+j"
    action: "tiling/focusNextSplit"       # focus window in next split (recent window off-grid)
  - combo: "capslock+k"
    action: "tiling/focusPreviousSplit"   # focus window in previous split (recent window off-grid)

  # --- system ---
  - combo: "capslock+q"
    action: "system/lock"

  # --- app-scoped bindings (only fire when that app is focused) ---
  # - combo: "cmd+k"
  #   action: "app/togglePicker"
  #   app: "com.googlecode.iterm2"
  # - combo: "cmd+shift+p"
  #   action: "app/togglePicker"
  #   app: "com.microsoft.VSCode"

  # --- key remaps (use `remap` instead of `action`) ---
  # Global remap (applies in all apps)
  # - combo: "ctrl+h"
  #   remap: "backspace"

  # Per-app remap (only when Safari is focused)
  - combo: "cmd+,"
    remap: "ctrl+shift+tab"       # previous tab
    app: "com.apple.Safari"
  - combo: "cmd+."
    remap: "ctrl+tab"             # next tab
    app: "com.apple.Safari"

  # - combo: "ctrl+h"
  #   remap: "cmd+backspace"
  #   app: "com.microsoft.VSCode"
  # - combo: "ctrl+d"
  #   remap: "forwarddelete"
  #   app: "com.microsoft.VSCode"

  # --- mouse remaps ---
  - combo: "mouse4"
    remap: "cmd+["                 # browser back
  - combo: "mouse5"
    remap: "cmd+]"                 # browser forward

# ---------------------------------------------------------------------------
# Keybinding Exclusions
# ---------------------------------------------------------------------------
# Bundle IDs where vibeshed keeps its hands off the keyboard completely.
# While one of these apps is focused, every key and mouse event passes
# straight through: no bindings (including the picker toggle), no remaps,
# and no capslock / space / tab modifier interception.
#
# Useful for remote-desktop and VM clients, where the combos belong to the
# machine on the other end rather than to this one.
# Bundle IDs are matched case-insensitively.
# ---------------------------------------------------------------------------
keybindingExclusions:
  - "com.realvnc.vncviewer"        # RealVNC Viewer
  # - "com.tigervnc.tigervnc"      # TigerVNC
  # - "com.microsoft.rdc.macos"    # Microsoft Remote Desktop
  # - "com.vmware.fusion"          # VMware Fusion
  # - "com.parallels.desktop.console"  # Parallels Desktop
  # - "com.utmapp.UTM"             # UTM

# ---------------------------------------------------------------------------
# Aliases (action shortcuts with optional pre-filled parameters)
# ---------------------------------------------------------------------------
# Aliases create searchable shortcuts for actions. Two types:
#   - With parameters: creates a new picker entry (e.g. "Safari" launches Safari)
#   - Without parameters: enriches the original action with alias keywords
#     (e.g. "Lock Screen" alias makes system/lock findable by "lock screen")
# Alias actions have IDs like "alias/Safari" for use in keybindings.
# ---------------------------------------------------------------------------
aliases:
  # App-focus shortcuts (bound to hyper + 1-0 above)
  # Use exact per-app action IDs so the alias enriches the existing action
  # (no duplicate entry in picker). The action ID format is:
  # application/app.{bundleID}
  - alias: "Safari"
    action: "application/app.com.apple.Safari"
    icon: "safari"
    keywords: ["browser"]

  - alias: "Chrome"
    action: "application/app.com.google.Chrome"
    icon: "globe"
    keywords: ["browser"]

  - alias: "IntelliJ"
    action: "application/app.com.jetbrains.intellij"
    icon: "hammer"
    keywords: ["editor", "ide", "java"]

  - alias: "VSCode"
    action: "application/app.com.microsoft.VSCode"
    icon: "chevron.left.forwardslash.chevron.right"
    keywords: ["editor", "code"]

  - alias: "Spotify"
    action: "application/app.com.spotify.client"
    icon: "music.note"
    keywords: ["music"]

  - alias: "Notes"
    action: "application/app.com.apple.Notes"
    icon: "note.text"
    keywords: ["notes"]

  - alias: "Zoom"
    action: "application/app.us.zoom.xos"
    icon: "video"
    keywords: ["video", "calls"]

  - alias: "Telegram"
    action: "application/app.ru.keepcoder.Telegram"
    icon: "paperplane"
    keywords: ["messaging", "chat"]

  - alias: "iTerm"
    action: "application/app.com.googlecode.iterm2"
    icon: "terminal"
    keywords: ["terminal", "shell"]

  # Parameterless aliases — enrich original actions with extra keywords
  - alias: "Lock Screen"
    action: "system/lock"
    icon: "lock"
    keywords: ["security", "away"]

  - alias: "Toggle Dark Mode"
    action: "system/toggleAppearance"
    icon: "circle.lefthalf.filled"
    keywords: ["theme", "light", "dark"]

  # Parameterized aliases with query placeholder (creates separate picker entries)
  - alias: "Search GitHub"
    action: "github/searchRepos"
    icon: "magnifyingglass"
    subtitle: "Search GitHub repos..."
    parameters:
      query: "{query}"

  - alias: "Search Spotify"
    action: "spotify/search"
    icon: "music.note"
    subtitle: "Search tracks, albums, artists..."
    parameters:
      query: "{query}"

  # Aliases with preset parameters run the action with them, as a separate picker
  # entry. The first-launch config adds this one when Homebrew isn't installed.
  - alias: "Install Homebrew"
    action: "terminal/runCommand"
    icon: "cup.and.saucer"
    subtitle: "Run the install script from brew.sh in Terminal"
    keywords: ["homebrew", "brew", "package manager"]
    parameters:
      command: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

  # URL aliases — open URLs directly in a browser
  - alias: "Google"
    action: "https://www.google.com/search?q={query}"
    icon: "magnifyingglass"
    subtitle: "Search Google..."
    browser: "chrome"
    parameters:
      query: "{query}"

  # Directory aliases — open folders in Finder
  - alias: "Downloads"
    action: "~/Downloads"
    icon: "arrow.down.circle"
    subtitle: "Open Downloads folder"

  - alias: "Projects"
    action: "~/Projects"
    icon: "folder"
    subtitle: "Open Projects folder"

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------
modules:

  # --- Window Management ---
  # Every key is optional; one left out keeps its built-in default (stops at 50% and
  # 100%, no padding).
  # window/focusLeft, focusRight, focusUp, focusDown focus the nearest window on that
  # side of the focused one (the frontmost of a stack), across displays.
  window:
    horizontalStops:
      - { value: 50, unit: percent }
      - { value: 100, unit: percent }
    verticalStops:
      - { value: 50, unit: percent }
      - { value: 100, unit: percent }
    # Per-display stop overrides. "match" is a display's exact name
    # (NSScreen.localizedName), "main", or a 0-based connection-order index.
    # A display with no matching entry (or one that omits a dimension) falls
    # back to horizontalStops/verticalStops above.
    # displays:
    #   - match: "Kuycon P20"
    #     horizontalStops:
    #       - { value: 57, unit: percent }
    #       - { value: 43, unit: percent }
    #       - { value: 100, unit: percent }
    padding:
      top: 4
      bottom: 4
      left: 4
      right: 4
      gap: 4
    # window/focusWindow lists the windows on screen, then the minimized ones
    # (of apps that aren't hidden). false lists only the windows on screen.
    includeMinimized: true
    enlargeShrinkStep:
      value: 10
      unit: percent
    # Tuning for the focus border: an outline in the theme's accent color around
    # the focused window, for any window at least minimumSize points wide and tall.
    # It hides while the window moves or resizes and comes back once it holds
    # still. NOT a config flag - off by default on every launch, toggled at
    # runtime via window/toggleFocusBorder.
    focusBorder:
      width: 3.0              # points
      cornerRadius: 16.0      # the windows' corner radius (macOS 27: 16); the ring follows it, 0 = sharp
      minimumSize: 200        # skip windows narrower/shorter than this (dialogs, popovers)
      pollingInterval: 0.1    # seconds between fallback checks; focus/move/resize are event-driven

  # --- Tiling Window Manager ---
  # A configurable region grid per display. "match" is the display's exact name
  # (NSScreen.localizedName, e.g. "Kuycon P20"), "main" (the primary display),
  # or a 0-based connection-order index ("1", "2", ...). columns/rows are
  # relative weights, not pixel counts or a fixed cell count alone —
  # [1, 2, 1] means 3 columns where the middle one is 2x as wide.
  # No macOS Space awareness (grids apply the same regardless of active Space).
  # Every key is optional. An empty `tiling:` gets a 2×2 default grid; a section that
  # leaves out defaultGrid has none, so unmatched displays aren't tiled.
  tiling:
    displays:
      # - match: main
      #   columns: [1, 1, 1]     # 3 equal columns
      #   rows: [2, 1]           # top row twice as tall as bottom row
      - match: "Kuycon P20"
        columns: [5707, 4293]      # ~ 57% / 43% width split
        rows: [1]
    defaultGrid:
      columns: [1]
      rows: [1]
    padding:
      top: 4
      bottom: 4
      left: 4
      right: 4
      gap: 4
    # Tuning for auto-tile. Auto-tile itself is NOT a config flag - it's off by
    # default on every launch and toggled at runtime via the tiling/toggleAutoTile
    # action (bind a hotkey below). While enabled it
    # tiles new/moved/resized windows, snaps once dropped (never mid-drag), and
    # never repositions a window already aligned to a cell (5pt tolerance).
    # Tooltips/HUDs/panels/dialogs are filtered out (fixed-size or non-standard
    # AX subrole) before tiling, plus anything below minimumSize.
    # A display's only visible window is maximized (padding still applies); the
    # grid kicks in once a second one appears, and closing, minimizing, or moving
    # windows away until one is left maximizes it again. attachAll follows the
    # same rule.
    autoTile:
      maximizeSingleWindow: true   # false = a lone window takes a grid cell like any other
      pollingInterval: 1.0         # seconds between checks (also affects move/resize latency)
      excludedBundleIDs: []        # e.g. ["com.apple.systempreferences"]
      minimumSize: 120             # skip windows narrower/shorter than this (tooltips, HUDs, etc.)

  # --- Application Launcher ---
  application:
    showRunningOnly: false
    cacheTTLSeconds: 3.0
    excludedBundleIDs:
      - "com.apple.Dock"
      - "com.apple.loginwindow"

  # --- Menu Items (needs Accessibility) ---
  # The menu bar of the app you're in, as actions. Every enabled item shows up in
  # search, and menu/search lists only menu items. An item's ID is its path —
  # "menu/File > New Tab" — and it clicks that item in whichever app is in front,
  # so it can be bound or aliased (add `app:` to a keybinding to scope it).
  menu:
    showInSearch: true         # false: only through menu/search
    maxSubmenuItems: 100       # skip bigger submenus (per-day history, bookmark lists)
    cacheTTLSeconds: 3.0
    excludedBundleIDs: []      # apps whose menus are never listed

  # --- Browser Tabs ---
  browser:
    browsers: []               # empty = all running supported browsers
    cacheTTLSeconds: 3.0
    maxResults: 50
    showCloseActions: true

  # --- System Utilities ---
  system:
    screenshotPath: "~/Screenshots"
    enabledActions:
      - lock
      - sleep
      - restart
      - shutdown
      - logout
      - missionControl
      - toggleAppearance
      - autoAppearance
      - toggleDock
      - toggleMenuBar
      - emptyTrash
      - screenshotFull
      - screenshotClipboard
      - screenshotInteractive
      - flushDNS
      - purgeMemory

  # --- Processes (list by CPU/mem/port usage, kill on select) ---
  processes:
    cacheTTLSeconds: 2.0
    maxResults: 100
    excludedNames: []          # e.g. ["kernel_task"]

  # --- Performance ---
  # CPU, memory, disk and network activity. Previews show the current values, a chart of
  # the history with its average and peak, and the top processes, per-core load, memory
  # split, volumes or interfaces. Selecting one opens Activity Monitor on the matching tab.
  #   performance/overview, performance/cpu, performance/memory, performance/disk,
  #   performance/network
  performance:
    sampleInterval: 2          # seconds between samples, taken in the background (0.5–60)
    historyMinutes: 60         # how far back the charts reach (1–1440)
    # networkInterfaces: [en0] # count only these; default: every Ethernet, Wi-Fi and cellular
    #                          # interface, leaving out VPN tunnels, bridges and VM interfaces
    # enabledActions: [overview, cpu, memory, disk, network]

  # --- System Settings Panes ---
  settings:
    # Uncomment to restrict which panes appear (default: all):
    # enabledPanes:
    #   - wifi
    #   - bluetooth
    #   - displays
    #   - sound
    #   - keyboard
    #   - privacy

    # Add custom panes as "Title": "pane-target-identifier"
    # customPanes:
    #   "Game Center": "com.apple.Game-Center-Settings.extension"

  # --- Theme ---
  # Palette themes applied across macOS and apps in one go: appearance, accent +
  # text highlight, folder color, pointer, wallpaper, the Vibeshed picker, iTerm, Ghostty,
  # Terminal, VS Code/Cursor/Windsurf, Zed, JetBrains, Neovim, Claude Code, plus your own templates.
  #   theme/switch        browse themes; each previews live as you move, Return applies, Esc reverts
  #   theme/apply.<slug>  apply one directly (e.g. theme/apply.tokyo-night — bind it or alias it)
  #   theme/next, theme/previous, theme/reapply, theme/fromWallpaper
  # 64 built-ins: Catppuccin, Tokyo Night, Rosé Pine, Kanagawa, Gruvbox, Everforest, Nord,
  # Solarized, GitHub, Ayu, Nightfox, Flexoki, Melange, One, Dracula, Monokai Pro, Night Owl,
  # Poimandres, Vesper, Moonfly, Sonokai, Iceberg, Vague + Omarchy's (Osaka Jade, Ristretto, …)
  # + classic desktops: BeOS, OS/2 Warp, OS/2 Text Mode, NeXTSTEP.
  theme:
    # livePreview: true               # apply the highlighted theme while browsing theme/switch
    # includeBuiltInThemes: true
    # generateWallpapers: true        # generate a wallpaper from the palette when a theme has no image
    # wallpaperStyle: glow            # glow, mesh, waves, ridges, bokeh, lowpoly, topographic, sunset,
    #                                 # arcs, halftone, pulsar, guilloche, sashiko, attractor, bauhaus,
    #                                 # destijl, truchet, terrazzo, circles, isometric, penrose, leaves,
    #                                 # warp, ascii, polyhedra, maze, dither, pipes, flow, lens, papercut,
    #                                 # automata, cyclic, chladni, complex, growth, solid,
    #                                 # or auto (a stable pick per theme, never flow through growth).
    #                                 # A style chosen with theme/wallpaperStyle overrides this;
    #                                 # a theme can set its own with `wallpaperStyle:`.
    # wallpaperGrain: true            # fine film grain on generated wallpapers

    # What a theme is applied to (default: all but github, which changes an account setting):
    # targets: [appearance, accent, folders, pointer, wallpaper, iterm, ghostty, terminal, vscode,
    #           zed, jetbrains, neovim, claude, bat, lsd, micro, btop, github, templates, hooks]
    # ghostty writes ~/.config/ghostty/themes/Vibeshed, sets `theme = Vibeshed` in Ghostty's config
    # and reloads open terminals (Ghostty 1.2+). Colors your Ghostty config sets itself
    # (background, palette, …) still override the theme's.
    # neovim writes ~/.config/nvim/colors/vibeshed.lua; select it once with
    # `vim.cmd.colorscheme("vibeshed")` and every running Neovim using it retints live.
    # bat/lsd/micro get generated themes on each switch (bat: select once with --theme=Vibeshed).
    # fzf needs nothing: configured with ANSI colour slots it follows the terminal palette.

    # Omarchy-style theme folders: <dir>/<name>/colors.toml (+ backgrounds/, light.mode).
    # Omarchy themes can be dropped in as-is.
    # themesDirectory: "~/.config/vibeshed/themes"

    # iTerm: the "Vibeshed" profile (your default profile + theme colors) becomes iTerm's
    # default so new windows and restarts keep the theme; false gives the default back.
    # itermDefaultProfile: true
    # Terminal.app: same idea with a "Vibeshed" profile in Terminal's settings (default and
    # startup profile). Open tabs get background/text/cursor colors live; ANSI colors arrive
    # when Terminal next launches (its AppleScript can't set them).
    # terminalDefaultProfile: true

    # Folders that also get a palette-tinted custom icon (on top of the system folder color).
    # folders:
    #   - "~/Projects"

    # Your own palettes. Keys follow Omarchy's colors.toml; only background, foreground
    # and red/green/yellow/blue/magenta/cyan are required — the rest is derived.
    # A theme named like a built-in replaces it; `base:` inherits and overrides.
    # `pair:` names the opposite-mode theme to switch to when the system's appearance does.
    # A theme without a pair is specifically light or dark: applying it turns off Auto
    # appearance, and applying a paired theme later turns Auto back on.
    # themes:
    #   - name: "Midnight"
    #     base: "Tokyo Night"
    #     pair: "Tokyo Night Day"
    #     colors:
    #       background: "#0b0b12"
    #       accent: "#ff9e64"
    #       pointer_fill: "#ff9e64"     # optional extras: pointer_fill, pointer_outline, folder, highlight
    #     wallpaper: "~/Pictures/Walls/midnight"   # image, or a folder (first image is used)
    #     macosAccent: "Orange"                     # default: nearest to the accent color
    #     apps:                                     # use existing app themes instead of generated ones
    #       vscode: "Tokyo Night"
    #       jetbrains: "_@user_Tokyo Night"
    #       ghostty: "TokyoNight Night"             # any name from `ghostty +list-themes`
    #       terminal: "Clear Dark"                  # one of Terminal's own profiles
    #       neovim: "tokyonight-night"              # an installed colorscheme, loaded as `vibeshed`
    #       github: "dark_dimmed"                   # also opts this theme into the github target

    # Templates for any other app, in Omarchy's placeholder syntax:
    # {{ background }}, {{ accent_strip }}, {{ red_rgb }}, {{ mix background green 15% }}, {{ mode }}
    # templates:
    #   - source: "~/.config/vibeshed/templates/kitty.conf.tpl"
    #     target: "~/.config/kitty/current-theme.conf"
    #     reload: "pkill -USR1 -x kitty"
    #     preview: true                  # also render during live preview

    # Commands run after each apply, with VIBESHED_THEME, VIBESHED_THEME_MODE,
    # VIBESHED_THEME_DIR and VIBESHED_COLOR_<KEY> (e.g. VIBESHED_COLOR_ACCENT) set.
    # hooks:
    #   - "sketchybar --reload"

    # theme/switchFont lists the installed fonts among ~50 popular coding fonts; add others
    # by family name. Terminals get a font's Nerd Font Mono variant when it's installed.
    # fonts: ["Comic Code", "PragmataPro Mono"]

    # VS Code-family editors (display name: Application Support folder); default: all detected
    # vscodeVariants:
    #   "Cursor": "Cursor"

    # JetBrains IDEs to theme (default: all detected)
    # jetbrainsIDEs: [idea, webstorm]

  # --- Wallpaper (search wallpaper sites and museum collections, set the result) ---
  # "Search Wallpapers" asks for a source (All Sources mixes their results), then searches
  # as you type; Enter downloads the highlighted image and sets it on every screen.
  # "Random Wallpaper" asks for a source and a subject (Enter on nothing: a featured image).
  # "Open Wallpaper Source Page" opens where the current wallpaper came from.
  # One key for a random painting: an alias with the steps filled in, bound as
  # "alias/Random Painting":
  #   aliases:
  #     - alias: "Random Painting"
  #       action: "wallpaper/random"
  #       parameters: {source: met}       # no query: a featured painting
  # artic: the Art Institute of Chicago's image server has turned away apps with a
  # Cloudflare browser check since June 2026; its results show up again once that ends.
  wallpaper:
    sources: [wallhaven, unsplash, artic, rijksmuseum, met]   # order = mixing order
    maxResultsPerSource: 10
    orientation: landscape        # landscape, portrait or any
    scaling: auto                 # auto: photos fill the screen, artwork of another shape
                                  # is fitted on a matte in its edge color; or fill / fit
    # downloadDirectory: "~/Pictures/Wallpapers"   # kept forever; default: Application
                                                   # Support, which keeps the 40 most recent
    # wallhavenAPIKey: "..."      # optional (wallhaven.cc account settings)
    wallhavenCategories: [general, anime]   # general, anime, people
    # unsplashAccessKey: "..."    # needed for Unsplash: https://unsplash.com/oauth/applications
    # enabledActions: [search, random, openSourcePage]

  # --- Audio Control ---
  audio:
    volumeSteps: [25, 50, 75, 100]
    volumeStep: 10

  # --- Clipboard History ---
  # Anything an app marks private is never recorded: passwords and codes from
  # password managers (nspasteboard.org concealed/transient types).
  clipboard:
    maxItems: 200
    pollingInterval: 0.5
    showClearAction: true
    pasteOnSelect: true
    excludePatterns:
      - "^ghp_"              # GitHub tokens
      - "^sk-"               # OpenAI API keys
      - "^AKIA"              # AWS access keys

  # --- Spotify ---
  # Get clientId from https://developer.spotify.com/dashboard
  spotify:
    clientId: null            # set to enable Web API search
    maxSearchResults: 10
    searchTypes: [track, album, artist, playlist]
    showNowPlaying: true

  # --- GitHub ---
  # Token: https://github.com/settings/tokens (repo, notifications scopes)
  github:
    token: null               # set to increase rate limit & enable notifications
    useGitHubCLI: true        # no token? use the GitHub CLI's login (`gh auth token`)
    ghPath: null              # where gh is, if not /opt/homebrew/bin or /usr/local/bin
    defaultOwner: null        # e.g. "myorg" — scopes searches to org by default
    repoOwners: null          # fetch repos from multiple orgs/users: ["org1", "user1"]
    maxResults: 10
    searchTypes: [repo, issue, pr]
    showRepos: true           # list your repos as searchable picker actions
    showNotifications: true
    showPullRequests: true    # your open pull requests in the main search ("satis" finds "Make … satisfying")
    pullRequestFilters: [author, review-requested]  # also: assignee, involves, mentions
    maxPullRequests: 50       # per filter, 1–100
    pullRequestRefresh: 120   # seconds before a picker open refreshes the list

  # --- VSCode / Cursor / Windsurf ---
  vscode:
    maxResults: 20
    showFiles: false
    showRemote: false
    variants:
      "Cursor": "Cursor"
      "Windsurf": "Windsurf"

  # --- iTerm Sessions ---
  iterm:
    maxResults: 20
    showCWD: true
    showJobName: true
    commands:
      "Top": "btop"
      "Lazygit": "lazygit"
      "Lazydocker": "lazydocker"
      "SSH Dev": "ssh user@dev.example.com"

  # --- Ghostty (needs Ghostty 1.3+ for AppleScript; theming is the theme module's `ghostty` target) ---
  # Open terminals (focus), new window/tab, Run Command, ghostty/reloadConfig.
  ghostty:
    maxResults: 20
    showCWD: true
    # Typed into a new tab's shell, which stays open when the command exits.
    commands:
      "Top": "btop"
      "Lazygit": "lazygit"
    # enabledActions: [newTab, runCommand, cmd, terminal]   # full names or families (cmd, terminal)

  # --- Terminal.app (theming is the theme module's `terminal` target) ---
  # New Window, Run Command and the commands below, each in a new window (Terminal's
  # AppleScript can't open a tab). The shell stays open when the command exits.
  terminal:
    commands:
      "Top": "top -o cpu"
    # enabledActions: [newWindow, runCommand, cmd]   # full names or the cmd family

  # --- Claude (Claude Code CLI + Claude Desktop) ---
  anthropic:
    maxResults: 20
    sources:
      - claudeCode
      - claudeDesktop
    showLaunchers: true
    # Where a session reopens by default: "terminal" (claude --resume) or
    # "desktop" (claude:// deeplink).
    resumeIn: "terminal"
    # Also list each session's other surface as its own row (a CLI session handed
    # to Claude Desktop, or a desktop session dropped into a terminal). Doubles
    # the number of session rows, so off by default.
    showAlternateResume: false
    terminalApp: "iterm"
    # claudePath: "/opt/homebrew/bin/claude"  # custom CLI path (auto-detected)

  # --- Codex (Codex CLI + Codex desktop app) ---
  openai:
    maxResults: 20
    sources:
      - codex
    showLaunchers: true
    # Start new sessions in a terminal instead of the Codex app. Existing
    # sessions always reopen in the app, the only surface addressable by id.
    newSessionInTerminal: false
    terminalApp: "iterm"
    # codexPath: "/opt/homebrew/bin/codex"    # custom CLI path (auto-detected)

  # --- OpenCode (OpenCode CLI + OpenCode desktop app) ---
  opencode:
    maxResults: 20
    sources:
      - opencode
    showLaunchers: true
    # Sessions always resume in a terminal (opencode --session <id>): the
    # desktop app has no URL that opens a session.
    terminalApp: "iterm"
    # opencodePath: "/opt/homebrew/bin/opencode"  # custom CLI path (auto-detected)

  # --- Telegram ---
  telegram:
    showLaunchAction: true
    showSavedMessages: true
    chats:
      - name: "Saved Messages"
        username: "saved"
        type: chat
        icon: "bookmark"

  # --- Zed ---
  zed:
    maxResults: 20
    showRemote: false
    # zedPath: "/opt/homebrew/bin/zed"  # custom CLI path (auto-detected by default)

  # --- JetBrains IDEs ---
  jetbrains:
    maxResults: 20
    openInNewWindow: true      # patch IDE settings to always open in new window
    # enabledIDEs:             # nil = all detected IDEs
    #   - idea
    #   - pycharm
    #   - webstorm
    #   - goland
    #   - rustrover
    # IDE tags: idea, pycharm, webstorm, datagrip, goland,
    #           rustrover, clion, rider, phpstorm, rubymine, studio

  # --- Meeting Prep ---
  meetingPrep:
    prepWindowMinutes: 15       # Show prep actions N minutes before meeting
    autoJoinVideo: false        # Auto-join video call when preparing
    # hideApps:                 # Bundle IDs of apps to minimize (if set, only these are hidden)
    #   - "com.tinyspeck.slackmacgap"
    #   - "com.hnc.Discord"
    #   - "com.apple.mail"
    # keepApps:                 # Bundle IDs to keep visible (if set, everything else is hidden)
    #   - "us.zoom.xos"
    #   - "com.google.Chrome"

  # --- Calendar Events ---
  calendar:
    lookaheadHours: 24
    lookbehindMinutes: 30
    showAllDayEvents: false
    showDeclinedEvents: false
    showOpenCalendarAction: true
    # excludedCalendars:
    #   - "Birthdays"
    #   - "US Holidays"
    # includedCalendars:          # if set, only these calendars are shown
    #   - "Work"
    #   - "Personal"

  # --- Zoom Meetings ---
  zoom:
    showStartMeeting: true
    showJoinAction: true
    showLaunchAction: true
    # personalMeetingId: "123 456 7890"   # for "Start My Meeting" action
    meetings:
      - name: "Weekly Standup"
        meetingId: "123 456 7890"
        password: "abc123"
        keywords: ["standup", "daily"]
      # - name: "Team Retro"
      #   link: "https://zoom.us/j/1234567890?pwd=xyz"
      #   keywords: ["retro", "sprint"]

  # --- Bookmarks & History ---
  # Requires Full Disk Access permission for reading Safari bookmarks/history.
  # Chromium bookmarks/history are read from Application Support (no FDA needed).
  bookmark:
    browsers: []               # empty = all installed Safari + Chromium browsers
    maxBookmarks: 100          # max bookmark actions (0 = unlimited)
    maxVisited: 30             # max most-visited history entries
    showMostVisited: true      # show most-visited URL actions
    minVisitCount: 3           # minimum visits to include a history entry
    cacheTTLSeconds: 300       # re-read bookmarks/history every 5 minutes

  # --- Apple Notes ---
  # Search Notes (titles and text), New Note, and your latest notes in the main search.
  # Scripts Notes, so macOS asks once to let Vibeshed control it. The main search lists
  # notes only once Notes has run since Vibeshed started; it never launches Notes.
  notes:
    maxResults: 100            # latest notes in the main search (0 = none; Search Notes has all)
    searchContent: true        # Search Notes matches note text too, not just titles
    # newNoteFolder: "Inbox"   # folder for New Note (default: Notes' default folder)
    # enabledActions: [search, create, note]   # full names or the note family

  # --- Timers & Reminders ---
  timer:
    defaultSound: "Glass"                # macOS system sound name
    presetDurations: [1, 5, 10, 15, 30, 60]  # preset timer durations in minutes
    maxActiveTimers: 20
    # enabledActions:
    #   - setTimer
    #   - setReminder
    #   - cancelAll
    #   - clearCompleted

  # --- Math & Conversions ---
  math:
    decimalPlaces: 6            # Max decimal places (trailing zeros stripped)
    enableCurrency: true        # Fetch live exchange rates
    currencyRateTTL: 3600       # Rate cache TTL in seconds
    copyOnSelect: true          # Copy result to clipboard on Enter
    showBaseConversions: true   # Show hex/bin/oct for integer results
    # enabledActions:           # nil = all enabled
    #   - expression
    #   - unitConversion
    #   - currencyConversion
    #   - percentage
    #   - baseConversion

  # --- Homebrew ---
  # Installing something another module works with (the spotify cask, the gh formula, …)
  # adds that module's section to this file, keeping your comments, and loads it.
  homebrew:
    brewPath: "/opt/homebrew/bin/brew"
    # enabledActions:
    #   - installFormula
    #   - installCask
    #   - uninstallFormula
    #   - uninstallCask
    #   - update
    #   - upgrade
    #   - outdated
    #   - cleanup

  # --- Web Search (fallback actions when nothing else matches) ---
  websearch:
    minQueryLength: 2
    engines:
      - name: "Google"
        urlTemplate: "https://www.google.com/search?q={query}"
      - name: "DuckDuckGo"
        urlTemplate: "https://duckduckgo.com/?q={query}"

  # --- Emoji (search by name/keyword, copies to clipboard) ---
  emoji:
    maxResults: 8
    pasteOnSelect: false     # true: also send Cmd+V into the frontmost app

  # --- Self (Vibeshed meta-actions) ---
  self:
    enabledActions:
      - openConfig
      - openConfigDir
      - reloadConfig
      - moduleStatus
      - openLogs
      - toggleKeystrokeVisualizer
      - quit

# ---------------------------------------------------------------------------
# Layout Correction
# ---------------------------------------------------------------------------
# When a query matches nothing (web search aside) but retyping it on your Latin
# layout would match, the picker retries with the corrected text and shows a
# hint banner — e.g. "ыфафкш" → "safari". Works for every keyboard layout you
# have enabled (Russian, Ukrainian, Greek, Hebrew, Arabic, Georgian…) plus the
# Korean (2-Set), Japanese (romaji) and Chinese (Zhuyin) input methods.
# Enabled by default; set enabled: false to turn it off.
# ---------------------------------------------------------------------------
layoutCorrection:
  enabled: true

# ---------------------------------------------------------------------------
# URL Routing (default browser replacement)
# ---------------------------------------------------------------------------
# When registerAsDefaultBrowser is true, the app becomes the system default
# browser. URLs matching a rule open directly in the configured browser/profile.
# URLs that don't match any rule show a picker with installed browsers so you
# can choose where to open the link. Chromium browser profiles are discovered
# automatically.
#
# Zoom meeting links (https://*.zoom.us/j/...) are handled before any of the
# above: if Zoom is installed, they always launch the Zoom app directly and
# never show a rule match or the browser chooser picker. This is built-in,
# not configurable via rules below.
#
# Pattern syntax:
#   Glob:  *.example.com/*
#   Regex: /pattern/
# Browser names: safari, chrome, firefox, brave, edge, arc, orion, vivaldi, opera
# ---------------------------------------------------------------------------
urlRouting:
  registerAsDefaultBrowser: true
  defaultBrowser: "safari"    # Pre-selected in the browser chooser picker
  # defaultProfile: "Default"  # Optional: default Chromium profile for rules without explicit profile
  rules:
    # URLs matching rules open directly without showing the chooser
    - pattern: "*.github.com/*"
      browser: "chrome"
      profile: "Work"          # Open in Chrome's "Work" profile (Chromium only)
    - pattern: "*.figma.com/*"
      browser: "chrome"

    # Google services in Chrome
    - pattern: "/.*\\.google\\.com/"
      browser: "chrome"
    - pattern: "*.googleapis.com/*"
      browser: "chrome"

    # Profile names are the directory names from Chromium's Local State file,
    # e.g. "Default", "Profile 1", "Profile 2", or custom names.
    # Only Chromium browsers (Chrome, Brave, Edge, Vivaldi, Opera) support profiles.
    # Non-Chromium browsers ignore the profile field.

    # Everything else shows the browser chooser picker
