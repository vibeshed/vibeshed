# The GIF at the top of the README: one short loop of search, themes and windows
# on a desktop with Zed and btop in Ghostty, starting and ending on the same
# frame (Vibeshed Glow, Zed focused, picker closed). Unlike the site's lap,
# the keystroke visualizer is on: a README has no captions beside the GIF.
#
# A smaller display than the lap's (1280×800), so the picker stays readable at
# the GIF's 960 px. Same base VM and props as scenes/site-lap.yaml: run
# scenes/site-lap-warmup.yaml first if the ranking drifted ("satis" must rank
# the track first, "my mind" the Claude Code session).
title: "README: hero loop"

setup:
  display: { width: 1280, height: 800 }
  locale: en_US
  dock: hidden
  menuBar: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  vibeshed:
    config: [../configs/site-videos.yaml, ../configs/site-search.yaml]
    reset: false                       # keep the ranking the warm-up taught
    keystrokes: true
  # Overlapping, with bare wallpaper top right and bottom left for each theme's to show.
  # Ghostty overlaps Zed, so ⇪→ and ⇪← hop between just the two.
  apps:
    - { app: Spotify, frame: [60, 60, 700, 400] }
    - { app: Ghostty, frame: [512, 272, 720, 480] }
    - { app: Zed, open: ~/code/vibeshed/Vibeshed/Picker/PickerView.swift, frame: [48, 48, 720, 500] }
  events: []                           # no Pairing session in the lists
  focus: Ghostty
  actions:
    - open: vibeshed://theme/apply.vibeshed-glow
    - open: vibeshed://window/toggleFocusBorder   # off at every launch; repaints with each theme
    - wait: 1.5
    - type: { text: "clear; btop", cps: 60 }
    - press: return
    - wait: 1
    # Spotify playing "(I Can't Get No) Satisfaction", then hidden. `open spotify:track:…`
    # only shows the album now; the CLI Spotify bundles plays it, with no Automation grant.
    - shell: /Applications/Spotify.app/Contents/MacOS/spotify_cli play spotify:track:2PzU4IB8Dr6mxV3lHuaG34
    - wait: 5
    - focus: Spotify
    - press: cmd+h
    - waitFor: { window: Spotify, gone: true, timeout: 5 }
    # The loop's themes once, off camera: each generated wallpaper renders for the
    # first time at this display size, and Zed reloads its theme.
    - open: vibeshed://theme/apply.tokyo-night
    - wait: 3
    - open: vibeshed://theme/apply.catppuccin-latte
    - wait: 3
    - open: vibeshed://theme/apply.mac-os-9
    - wait: 3
    - open: vibeshed://theme/apply.amiga-workbench-1-3
    - wait: 3
    - open: vibeshed://theme/apply.vibeshed-glow
    - wait: 3
    - focus: Ghostty
    - focus: Zed                               # in front
    - wait: 1
    - press: escape                            # Zed's "Introducing Delta" announcement
    - wait: 0.5
  settle: 2

record: { leadIn: 0.3, leadOut: 0.3, pauseOnDialogs: true }

actions:
  - marker: loop-start
  - wait: 1.0                                   # held still: the crossfade lands here

  # Search: what's playing, then a Claude Code session, each with its preview.
  - press: capslock+space
  - waitFor: picker
  - wait: 0.5
  - type: { text: satis, cps: 12 }
  - waitFor: { result: "(I Can't Get No) Satisfaction" }   # album art in the preview
  - wait: 2.6                                   # previews slide in after ~1.5 s still
  - press: cmd+a
  # "mind" alone also matches the much-used Restore Minimized Windows.
  - type: { text: my mind, cps: 12 }
  - waitFor: { result: teach the picker to read my mind }   # project, branch and model
  - wait: 2.6

  # Themes: every one repaints Zed, btop, the wallpaper and the picker live.
  - press: cmd+a
  # "theme" ranks Previous Theme first whatever the usage.
  - type: { text: switch theme, cps: 16 }
  - waitFor: { result: Switch Theme }
  - press: return
  - wait: 0.6
  - type: { text: tok, cps: 18 }
  - waitFor: { result: Tokyo Night }
  - wait: 1.4
  - press: cmd+a
  - type: { text: latte, cps: 18 }
  - waitFor: { result: Catppuccin Latte }
  - wait: 1.4
  - press: cmd+a
  - type: { text: os 9, cps: 18 }
  - waitFor: { result: Mac OS 9 }
  - wait: 1.4
  - press: cmd+a
  - type: { text: amiga, cps: 18 }
  - waitFor: { result: Amiga Workbench 1.3 }
  - wait: 1.6
  - press: escape                               # everything snaps back to Vibeshed Glow
  - wait: 0.3
  - press: escape                               # and the picker goes
  - waitFor: { window: picker, gone: true, timeout: 3 }
  - wait: 0.7

  # Windows: hop to btop, maximize it and back, hop home.
  - press: capslock+right
  - wait: 0.9
  - press: capslock+m
  - wait: 1.4
  - press: capslock+m
  - wait: 1.0
  - press: capslock+left                        # Zed in front again, as at the start
  - wait: 2.5                                   # the keystroke chips fade
  - marker: loop-end
  - wait: 0.5

outputs:
  - { name: readme, format: gif, from: loop-start, to: loop-end, width: 960, fps: 15, loop: 0.4 }
  - { name: readme-preview, from: loop-start, to: loop-end, width: 1280, fps: 30, loop: 0.4 }
